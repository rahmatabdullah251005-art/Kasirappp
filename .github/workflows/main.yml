name: Android CI/CD (Tajir)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Xmx512m"

jobs:
  build-and-unit-tests:
    name: Unit Tests & Debug APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || sudo -n mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || true
            (yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || \
              (yes | sudo -n "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || true
          fi

      - name: Prepare Environment, Keystore & Config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          raw = os.environ.get("GOOGLE_SERVICES_JSON_B64", "")
          out_path = Path("app/google-services.json")
          env_path = Path(os.environ["GITHUB_ENV"])

          def write_env(key: str, value: str) -> None:
              with env_path.open("a", encoding="utf-8") as f:
                  f.write(f"{key}={value}\n")

          def try_parse_google_services(text: str):
              cleaned = text.lstrip("\ufeff").strip()
              if not cleaned:
                  return None, "Secret kosong."
              candidates = []
              if cleaned.startswith("{"):
                  candidates.append(cleaned)
              else:
                  b64 = re.sub(r"^data:[^;]+;base64,", "", cleaned, flags=re.IGNORECASE)
                  b64 = b64.strip("\"'")
                  b64 = re.sub(r"\s+", "", b64)
                  b64 = b64.replace("-", "+").replace("_", "/")
                  b64 += "=" * ((-len(b64)) % 4)
                  try:
                      decoded = base64.b64decode(b64, validate=False).decode("utf-8", errors="strict")
                      candidates.append(decoded.lstrip("\ufeff").strip())
                      # Handle accidental double base64 encoding
                      if candidates[-1] and not candidates[-1].startswith("{"):
                          b64_2 = re.sub(r"\s+", "", candidates[-1]).replace("-", "+").replace("_", "/")
                          b64_2 += "=" * ((-len(b64_2)) % 4)
                          decoded_2 = base64.b64decode(b64_2, validate=False).decode("utf-8", errors="strict")
                          candidates.append(decoded_2.lstrip("\ufeff").strip())
                  except Exception as exc:
                      return None, f"Gagal decode Base64 ({exc.__class__.__name__})."

              last_err = "Format JSON tidak valid."
              for candidate in candidates:
                  try:
                      obj = json.loads(candidate)
                  except Exception as exc:
                      last_err = f"Hasil decode bukan JSON valid ({exc.__class__.__name__})."
                      continue
                  if not isinstance(obj, dict) or "project_info" not in obj or not isinstance(obj.get("client"), list) or not obj["client"]:
                      last_err = "Struktur JSON bukan file google-services.json Firebase yang lengkap."
                      continue
                  packages = [
                      c.get("client_info", {}).get("android_client_info", {}).get("package_name", "")
                      for c in obj["client"]
                      if isinstance(c, dict)
                  ]
                  expected_pkg = "com.aistudio.kasirbarokah.mrzqkp"
                  if expected_pkg not in packages:
                      last_err = f"package_name di google-services.json ({', '.join(p for p in packages if p) or 'kosong'}) tidak cocok dengan {expected_pkg}."
                      continue
                  return obj, ""
              return None, last_err

          if raw.strip():
              parsed, err = try_parse_google_services(raw)
              if parsed is not None:
                  out_path.parent.mkdir(parents=True, exist_ok=True)
                  out_path.write_text(json.dumps(parsed, indent=2) + "\n", encoding="utf-8")
                  write_env("HAS_GOOGLE_SERVICES", "true")
                  write_env("GOOGLE_SERVICES_STATUS", "secret_ok")
                  print("Successfully prepared app/google-services.json from GOOGLE_SERVICES_JSON_B64.")
              else:
                  if out_path.exists():
                      out_path.unlink()
                  write_env("HAS_GOOGLE_SERVICES", "false")
                  write_env("GOOGLE_SERVICES_STATUS", "secret_invalid")
                  write_env("GOOGLE_SERVICES_ERROR", err)
                  print(f"::warning::GOOGLE_SERVICES_JSON_B64 diabaikan: {err}")
          elif out_path.exists():
              write_env("HAS_GOOGLE_SERVICES", "true")
              write_env("GOOGLE_SERVICES_STATUS", "repo_file")
              print("Using existing app/google-services.json from repository.")
          else:
              write_env("HAS_GOOGLE_SERVICES", "false")
              write_env("GOOGLE_SERVICES_STATUS", "missing")
              print("No app/google-services.json found; building APK with fallback screen.")
          PY

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          RUNNER_CMD="gradle"
          if [ -x ./gradlew ]; then
            RUNNER_CMD="./gradlew"
          fi
          "$RUNNER_CMD" :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --no-daemon --stacktrace

      - name: Upload Debug APK
        if: ${{ !cancelled() && steps.build_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: tajir-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run Unit & Robolectric Tests
        shell: bash
        run: |
          RUNNER_CMD="gradle"
          if [ -x ./gradlew ]; then
            RUNNER_CMD="./gradlew"
          fi
          "$RUNNER_CMD" :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Write APK Download Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Download APK Tajir"
            if [ "${{ steps.build_apk.outcome }}" = "success" ]; then
              echo "- Artifact **\`tajir-debug-apk\`** berhasil dibuat. Scroll ke bagian **Artifacts** di halaman ringkasan workflow ini lalu klik **\`tajir-debug-apk\`** untuk mengunduh file ZIP berisi \`app-debug.apk\`."
              if [ "${GOOGLE_SERVICES_STATUS}" = "secret_invalid" ]; then
                echo "- Peringatan: Secret \`GOOGLE_SERVICES_JSON_B64\` terisi tetapi tidak valid (${GOOGLE_SERVICES_ERROR}). Build tetap dilanjutkan tanpa Firebase agar APK tetap bisa diunduh. Pastikan isi secret adalah hasil base64 utuh (atau isi JSON utuh) dari file \`app/google-services.json\`."
              elif [ "${HAS_GOOGLE_SERVICES}" != "true" ]; then
                echo "- Catatan: \`app/google-services.json\` tidak ditemukan saat build CI. Untuk mengaktifkan Google Sign-In & Firestore pada APK hasil build GitHub, tambahkan file \`app/google-services.json\` ke repo atau simpan base64-nya di GitHub Repository Secret \`GOOGLE_SERVICES_JSON_B64\`."
              fi
            else
              echo "- Build APK debug gagal. Periksa log langkah **Build Debug APK**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  firestore-rules-tests:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || sudo -n mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || true
            (yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || \
              (yes | sudo -n "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || true
          fi

      - name: Prepare Environment & Debug Keystore
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          raw = os.environ.get("GOOGLE_SERVICES_JSON_B64", "").lstrip("\ufeff").strip()
          out_path = Path("app/google-services.json")
          if not raw:
              raise SystemExit(0)

          candidates = []
          if raw.startswith("{"):
              candidates.append(raw)
          else:
              b64 = re.sub(r"^data:[^;]+;base64,", "", raw, flags=re.IGNORECASE).strip("\"'")
              b64 = re.sub(r"\s+", "", b64).replace("-", "+").replace("_", "/")
              b64 += "=" * ((-len(b64)) % 4)
              try:
                  decoded = base64.b64decode(b64, validate=False).decode("utf-8", errors="strict").lstrip("\ufeff").strip()
                  candidates.append(decoded)
              except Exception:
                  candidates = []

          for candidate in candidates:
              try:
                  obj = json.loads(candidate)
                  if isinstance(obj, dict) and "project_info" in obj and obj.get("client"):
                      out_path.parent.mkdir(parents=True, exist_ok=True)
                      out_path.write_text(json.dumps(obj, indent=2) + "\n", encoding="utf-8")
                      print("Prepared app/google-services.json for rules tests.")
                      raise SystemExit(0)
              except Exception:
                  pass
          print("::warning::GOOGLE_SERVICES_JSON_B64 tidak valid untuk rules tests; melanjutkan tanpa app/google-services.json.")
          PY

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Install Firebase CLI & Rules Test SDK
        shell: bash
        run: |
          mkdir -p /tmp/firebase-ci
          npm install --prefix /tmp/firebase-ci --no-save \
            firebase-tools \
            @firebase/rules-unit-testing \
            firebase
          echo "/tmp/firebase-ci/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=/tmp/firebase-ci/node_modules" >> "$GITHUB_ENV"

      - name: Run JS & Kotlin Firestore Rules Tests via Emulator
        shell: bash
        run: |
          RUNNER_CMD="gradle"
          if [ -x ./gradlew ]; then
            RUNNER_CMD="./gradlew"
          fi
          firebase emulators:exec --only firestore,auth --project demo-no-project \
            "export FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 && export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 && node --test firestore.test.js && ${RUNNER_CMD} :app:testDebugUnitTest --tests \"*Rule*\" -Dorg.gradle.jvmargs=\"-Xmx2g -Dfile.encoding=UTF-8\" --no-daemon --stacktrace"

      - name: Upload Rules Test Reports & Emulator Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rules-test-reports-and-logs
          path: |
            app/build/reports/tests/testDebugUnitTest/
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: ignore

  build-release-artifacts:
    name: Release APK & AAB (Optional Signing Secrets)
    needs:
      - build-and-unit-tests
      - firestore-rules-tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || sudo -n mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || true
            (yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || \
              (yes | sudo -n "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build Signed Release APK & AAB
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not configured. Skipping signed release build."
            echo "SKIP_RELEASE_UPLOAD=true" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path

          gs_raw = os.environ.get("GOOGLE_SERVICES_JSON_B64", "").lstrip("\ufeff").strip()
          if gs_raw:
              gs_path = Path("app/google-services.json")
              if gs_raw.startswith("{"):
                  obj = json.loads(gs_raw)
              else:
                  b64 = re.sub(r"^data:[^;]+;base64,", "", gs_raw, flags=re.IGNORECASE).strip("\"'")
                  b64 = re.sub(r"\s+", "", b64).replace("-", "+").replace("_", "/")
                  b64 += "=" * ((-len(b64)) % 4)
                  obj = json.loads(base64.b64decode(b64, validate=False).decode("utf-8", errors="strict").lstrip("\ufeff").strip())
              gs_path.parent.mkdir(parents=True, exist_ok=True)
              gs_path.write_text(json.dumps(obj, indent=2) + "\n", encoding="utf-8")

          ks_raw = os.environ.get("RELEASE_KEYSTORE_BASE64", "").strip().strip("\"'")
          ks_b64 = re.sub(r"\s+", "", ks_raw).replace("-", "+").replace("_", "/")
          ks_b64 += "=" * ((-len(ks_b64)) % 4)
          Path("/tmp/my-upload-key.jks").write_bytes(base64.b64decode(ks_b64, validate=False))
          PY
          export KEYSTORE_PATH=/tmp/my-upload-key.jks

          RUNNER_CMD="gradle"
          if [ -x ./gradlew ]; then
            RUNNER_CMD="./gradlew"
          fi
          "$RUNNER_CMD" :app:assembleRelease :app:bundleRelease \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --no-daemon --stacktrace
          echo "SKIP_RELEASE_UPLOAD=false" >> "$GITHUB_ENV"

      - name: Upload Release APK & AAB
        if: env.SKIP_RELEASE_UPLOAD == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: tajir-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
