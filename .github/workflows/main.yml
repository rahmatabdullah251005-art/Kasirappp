name: Android CI/CD (Tajir)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Xmx512m"

jobs:
  build-and-unit-tests:
    name: Unit Tests & Debug APK Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || sudo -n mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || true
            (yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || \
              (yes | sudo -n "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || true
          fi

      - name: Prepare Environment, Keystore & Config
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
            echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
          elif [ -f app/google-services.json ]; then
            echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
          else
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build Debug APK
        id: build_apk
        shell: bash
        run: |
          RUNNER_CMD="gradle"
          if [ -x ./gradlew ]; then
            RUNNER_CMD="./gradlew"
          fi
          "$RUNNER_CMD" :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --no-daemon --stacktrace

      - name: Upload Debug APK
        if: ${{ !cancelled() && steps.build_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: tajir-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Run Unit & Robolectric Tests
        shell: bash
        run: |
          RUNNER_CMD="gradle"
          if [ -x ./gradlew ]; then
            RUNNER_CMD="./gradlew"
          fi
          "$RUNNER_CMD" :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Write APK Download Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Download APK Tajir"
            if [ "${{ steps.build_apk.outcome }}" = "success" ]; then
              echo "- Artifact **\`tajir-debug-apk\`** berhasil dibuat. Scroll ke bagian **Artifacts** di halaman ringkasan workflow ini lalu klik **\`tajir-debug-apk\`** untuk mengunduh file ZIP berisi \`app-debug.apk\`."
              if [ "${HAS_GOOGLE_SERVICES}" != "true" ]; then
                echo "- Catatan: \`app/google-services.json\` tidak ditemukan saat build CI. Untuk mengaktifkan Google Sign-In & Firestore pada APK hasil build GitHub, tambahkan file \`app/google-services.json\` ke repo atau simpan base64-nya di GitHub Repository Secret \`GOOGLE_SERVICES_JSON_B64\`."
              fi
            else
              echo "- Build APK debug gagal. Periksa log langkah **Build Debug APK**."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  firestore-rules-tests:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || sudo -n mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || true
            (yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || \
              (yes | sudo -n "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || true
          fi

      - name: Prepare Environment & Debug Keystore
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Install Firebase CLI & Rules Test SDK
        shell: bash
        run: |
          mkdir -p /tmp/firebase-ci
          npm install --prefix /tmp/firebase-ci --no-save \
            firebase-tools \
            @firebase/rules-unit-testing \
            firebase
          echo "/tmp/firebase-ci/node_modules/.bin" >> "$GITHUB_PATH"
          echo "NODE_PATH=/tmp/firebase-ci/node_modules" >> "$GITHUB_ENV"

      - name: Run JS & Kotlin Firestore Rules Tests via Emulator
        shell: bash
        run: |
          RUNNER_CMD="gradle"
          if [ -x ./gradlew ]; then
            RUNNER_CMD="./gradlew"
          fi
          firebase emulators:exec --only firestore,auth --project demo-no-project \
            "export FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 && export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 && node --test firestore.test.js && ${RUNNER_CMD} :app:testDebugUnitTest --tests \"*Rule*\" -Dorg.gradle.jvmargs=\"-Xmx2g -Dfile.encoding=UTF-8\" --no-daemon --stacktrace"

      - name: Upload Rules Test Reports & Emulator Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rules-test-reports-and-logs
          path: |
            app/build/reports/tests/testDebugUnitTest/
            firestore-debug.log
            firebase-debug.log
          if-no-files-found: ignore

  build-release-artifacts:
    name: Release APK & AAB (Optional Signing Secrets)
    needs:
      - build-and-unit-tests
      - firestore-rules-tests
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" "${SDK_ROOT}"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -n "$SDKMANAGER" ]; then
            mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || sudo -n mkdir -p "${SDK_ROOT}/licenses" 2>/dev/null || true
            (yes | "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || \
              (yes | sudo -n "$SDKMANAGER" --sdk_root="${SDK_ROOT}" --licenses >/dev/null 2>&1) || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Build Signed Release APK & AAB
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Release signing secrets (RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) are not configured. Skipping signed release build."
            echo "SKIP_RELEASE_UPLOAD=true" >> "$GITHUB_ENV"
            exit 0
          fi

          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          fi

          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/my-upload-key.jks
          export KEYSTORE_PATH=/tmp/my-upload-key.jks

          RUNNER_CMD="gradle"
          if [ -x ./gradlew ]; then
            RUNNER_CMD="./gradlew"
          fi
          "$RUNNER_CMD" :app:assembleRelease :app:bundleRelease \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --no-daemon --stacktrace
          echo "SKIP_RELEASE_UPLOAD=false" >> "$GITHUB_ENV"

      - name: Upload Release APK & AAB
        if: env.SKIP_RELEASE_UPLOAD == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: tajir-release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
